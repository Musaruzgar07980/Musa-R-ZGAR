<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusaRUZGAR - Pazar Alanı & Çekiliş</title>

    <link rel="icon" type="image/png" href="https://i.hizliresim.com/9tiys4o.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-dark: #08080a;
            --card-bg: rgba(15, 14, 18, 0.95);
            --card-border: rgba(212, 160, 23, 0.6);
            --gold-primary: #f3c344;
            --gold-secondary: #d49f17;
            --gold-glow: rgba(243, 195, 68, 0.35);
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --twitch-color: #9146ff;
            --youtube-color: #ff0000;
            --green-dot: #25d366;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at center, rgba(20, 15, 10, 0.8) 0%, rgba(5, 5, 8, 0.98) 100%),
                url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px 80px 15px;
            position: relative;
        }

        .top-admin-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(18, 16, 20, 0.95);
            border: 1px solid var(--gold-secondary);
            color: var(--gold-primary);
            padding: 8px 16px;
            border-radius: 20px;
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            z-index: 9999;
            backdrop-filter: blur(5px);
            text-transform: uppercase;
        }

        .top-admin-btn:hover {
            background: rgba(212, 159, 23, 0.25);
            border-color: var(--gold-primary);
            box-shadow: 0 0 15px var(--gold-glow);
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 500px;
        }

        .custom-logo {
            width: 100%;
            max-height: 200px;
            border-radius: 12px;
            border: 2px solid var(--gold-secondary);
            box-shadow: 0 0 25px rgba(212, 159, 23, 0.3);
            margin-bottom: 12px;
            object-fit: cover;
            background-color: #121016;
        }

        .brand-domain {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            letter-spacing: 3px;
            color: var(--gold-primary);
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(243, 195, 68, 0.4);
        }

        .game-tabs-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            width: 100%;
            max-width: 550px;
            margin-top: 5px;
        }

        .game-tab-btn {
            flex: 1;
            background: rgba(14, 12, 18, 0.85);
            border: 2px solid var(--card-border);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .game-tab-btn:hover {
            border-color: var(--gold-secondary);
            transform: translateY(-2px);
        }

        .game-tab-btn.active {
            background: rgba(212, 159, 23, 0.15);
            border-color: var(--gold-primary);
            box-shadow: 0 0 20px var(--gold-glow);
        }

        .game-tab-img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--gold-secondary);
            background: #000;
        }

        .game-tab-title {
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
            text-align: center;
        }

        .game-tab-btn.active .game-tab-title {
            color: var(--gold-primary);
            text-shadow: 0 0 8px rgba(243, 195, 68, 0.5);
        }

        .gb-banner-btn {
            width: 100%;
            max-width: 550px;
            padding: 14px 20px;
            background: rgba(14, 12, 18, 0.85);
            border: 2px solid var(--card-border);
            border-radius: 14px;
            color: var(--gold-primary);
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s ease;
            text-decoration: none;
            text-transform: uppercase;
            backdrop-filter: blur(5px);
        }

        .gb-banner-btn:hover {
            background: rgba(212, 159, 23, 0.15);
            border-color: var(--gold-primary);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 0 20px var(--gold-glow), 0 6px 20px rgba(0, 0, 0, 0.6);
        }

        .open-giveaway-trigger-btn {
            width: 100%;
            max-width: 550px;
            padding: 16px 24px;
            background: linear-gradient(135deg, rgba(212, 159, 23, 0.25) 0%, rgba(255, 0, 0, 0.2) 100%);
            border: 2px solid var(--gold-primary);
            border-radius: 16px;
            color: var(--gold-primary);
            font-family: 'Cinzel', serif;
            font-weight: 800;
            font-size: 1.05rem;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 0 20px var(--gold-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
            text-transform: uppercase;
            margin: 10px 0;
        }

        .open-giveaway-trigger-btn:hover {
            background: linear-gradient(135deg, rgba(243, 195, 68, 0.4) 0%, rgba(255, 0, 0, 0.35) 100%);
            transform: translateY(-3px) scale(1.02);
            color: #ffffff;
            box-shadow: 0 0 30px rgba(243, 195, 68, 0.6);
        }

        .section-divider {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            width: 100%;
            margin-top: 10px;
        }

        .section-divider-inner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }

        .divider-line {
            height: 1px;
            flex-grow: 1;
            max-width: 200px;
            background: linear-gradient(90deg, transparent, var(--gold-secondary), transparent);
        }

        .section-title {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--gold-primary);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .title-dot {
            color: var(--green-dot);
            font-size: 0.55rem;
            text-shadow: 0 0 4px rgba(37, 211, 102, 0.5);
        }

        .section-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .stats-container {
            display: flex;
            justify-content: center;
            width: 100%;
            max-width: 250px;
        }

        .stat-card {
            width: 100%;
            background: rgba(14, 12, 18, 0.85);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .stat-card i {
            color: var(--gold-primary);
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .stat-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            font-family: 'Cinzel', serif;
        }

        .filter-container {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 600px;
            align-items: center;
            justify-content: center;
            margin-top: -10px;
        }

        .search-input {
            flex-grow: 1;
            background: rgba(14, 12, 18, 0.9);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 10px 14px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.95rem;
            outline: none;
            backdrop-filter: blur(5px);
        }

        .search-input:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 10px var(--gold-glow);
        }

        .sort-checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(14, 12, 18, 0.9);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 10px 14px;
            color: var(--gold-primary);
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .sort-checkbox-label input {
            accent-color: var(--gold-primary);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .streamers-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 800px;
        }

        .streamer-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: transform 0.3s ease;
            width: 100px;
            position: relative;
            perspective: 1000px;
        }

        .streamer-card:hover {
            transform: translateY(-6px);
        }

        .streamer-avatar-frame {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            padding: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .streamer-card.twitch .streamer-avatar-frame {
            background: linear-gradient(135deg, var(--twitch-color), #5c16c5);
            box-shadow: 0 0 10px rgba(145, 70, 255, 0.4);
        }

        .streamer-card.youtube .streamer-avatar-frame {
            background: linear-gradient(135deg, var(--youtube-color), #800000);
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
        }

        .streamer-card:hover .streamer-avatar-frame {
            transform: rotateY(360deg);
        }

        .streamer-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: #121016;
            border: 2px solid #000;
        }

        .platform-badge {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            color: #fff;
            border: 2px solid #08080a;
        }

        .twitch-badge { background-color: var(--twitch-color); }
        .youtube-badge { background-color: var(--youtube-color); }

        .streamer-name {
            font-size: 0.85rem;
            font-weight: 700;
            color: #fff;
            text-align: center;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .admin-streamer-btns {
            display: flex;
            gap: 4px;
            margin-top: -2px;
        }

        .admin-edit-btn {
            background: #1e3a8a;
            color: #93c5fd;
            border: 1px solid #1d4ed8;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.65rem;
            cursor: pointer;
            display: none;
        }

        .admin-delete-btn {
            background: #7f1d1d;
            color: #fca5a5;
            border: 1px solid #991b1b;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.65rem;
            cursor: pointer;
            display: none;
        }

        .btn-gold {
            width: 100%;
            max-width: 420px;
            padding: 12px 20px;
            background: linear-gradient(180deg, #f5d77f 0%, #d49f17 50%, #996e06 100%);
            border: 1px solid #ffe89e;
            border-radius: 20px;
            color: #1a0f00;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-gold:hover {
            filter: brightness(1.1);
            box-shadow: 0 0 15px var(--gold-glow);
        }

        .btn-whatsapp {
            width: 100%;
            max-width: 420px;
            padding: 12px 20px;
            background: linear-gradient(180deg, #25d366 0%, #128c7e 100%);
            border: 1px solid #69f0ae;
            border-radius: 20px;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            text-transform: uppercase;
        }

        .wa-groups-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            width: 100%;
            max-width: 600px;
        }

        .btn-group-card {
            background: rgba(15, 25, 20, 0.85);
            border: 1px solid rgba(37, 211, 102, 0.4);
            border-radius: 12px;
            padding: 10px 16px;
            color: #25d366;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-group-card:hover {
            background: rgba(37, 211, 102, 0.2);
            border-color: #25d366;
            color: #fff;
        }

        .items-grid, .equipments-grid {
            display: flex !important;
            flex-wrap: wrap !important;
            justify-content: center !important;
            align-items: center !important;
            gap: 16px;
            width: 100% !important;
            max-width: 1100px;
            margin: 0 auto !important;
        }

        .item-card-container {
            background: var(--card-bg);
            border: 1.5px solid var(--gold-secondary);
            border-radius: 12px;
            width: 220px !important;
            padding: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(6px);
            transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease;
        }

        .item-card-container:hover {
            border-color: var(--gold-primary);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.8), 0 0 12px var(--gold-glow);
            transform: translateY(-3px);
        }

        .item-img-box {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            border: none;
            background: #08070a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 10px;
            padding: 4px;
        }

        .item-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 50%;
            transform: scale(1.3);
            border-radius: 6px;
        }

        .item-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
            line-height: 1.2;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
        }

        .item-price {
            font-size: 1rem;
            font-weight: 800;
            color: var(--gold-primary);
            margin-bottom: 10px;
        }

        .item-actions {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
        }

        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
            width: 100%;
        }

        .btn-wa { background: #25d366; color: #000; }
        .btn-wa:hover { background: #1eb855; }
        .btn-st { background: #e67e22; color: #fff; }
        .btn-st:hover { background: #d35400; }
        .btn-bng { background: #e74c3c; color: #fff; }
        .btn-bng:hover { background: #c0392b; }
        
        .btn-edit-action { background: #1d4ed8; color: #fff; display: none; }
        .btn-delete { background: #7f1d1d; color: #fca5a5; border: 1px solid #991b1b; display: none; }

        .eq-card-container {
            background-color: transparent;
            width: 220px !important;
            height: 350px !important;
            perspective: 1000px;
            margin: 0 !important;
        }

        .eq-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .eq-card-inner.flipped {
            transform: rotateY(180deg);
        }

        .eq-card-front, .eq-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            border: 2px solid var(--gold-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            backdrop-filter: blur(8px);
            overflow: hidden;
            box-shadow: 0 0 10px rgba(212, 159, 23, 0.15);
        }

        .eq-card-front {
            background: var(--card-bg);
            color: white;
            justify-content: flex-start;
        }

        .eq-card-front h3 {
            font-size: 0.85rem;
            color: var(--gold-primary);
            font-family: 'Cinzel', serif;
            margin-bottom: 6px;
            line-height: 1.1;
            height: 2.2em;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            width: 100%;
        }

        .eq-card-front img {
            width: 100% !important;
            height: 155px !important;
            object-fit: contain;
            margin-bottom: 8px;
            border-radius: 8px;
            background: #000;
            padding: 2px;
            border: none;
        }

        .eq-card-front .front-eq-price {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--gold-primary);
            margin-bottom: 4px;
        }

        .item-stock {
            font-size: 0.8rem;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 4px;
        }

        .btn-detail-toggle {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(212, 159, 23, 0.2);
            border: 1px solid var(--gold-secondary);
            color: var(--gold-primary);
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 10;
        }

        .btn-detail-toggle:hover {
            background: var(--gold-primary);
            color: #000;
        }

        .eq-card-back {
            background: rgba(14, 12, 18, 0.98);
            color: #ffffff;
            transform: rotateY(180deg);
            border-color: var(--gold-primary);
            text-align: left;
            justify-content: space-between;
            overflow-y: auto;
        }

        .eq-card-back-content {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .eq-card-back h3 {
            font-size: 0.8rem;
            color: var(--gold-primary);
            margin-bottom: 6px;
            border-bottom: 2px solid var(--gold-secondary);
            padding-bottom: 4px;
            width: 100%;
            text-align: center;
            font-family: 'Cinzel', serif;
        }

        .eq-specs-list {
            list-style: none;
            width: 100%;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .eq-specs-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed rgba(243, 195, 68, 0.3);
            padding-bottom: 2px;
        }

        .eq-specs-list span.spec-label { color: #94a3b8; font-weight: 700; font-size: 0.7rem; }
        .eq-specs-list span.spec-val { color: #ffffff; font-weight: 800; font-size: 0.75rem; }

        .admin-panel {
            display: none;
            width: 100%;
            max-width: 600px;
            background: rgba(14, 12, 18, 0.95);
            border: 1px solid var(--gold-primary);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .admin-nav-btns {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .admin-nav-btn {
            background: rgba(20, 18, 24, 0.9);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 8px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .admin-nav-btn.active {
            background: var(--gold-secondary);
            color: #000;
            border-color: var(--gold-primary);
        }
        .admin-tab-content { display: none; }
        .admin-tab-content.active { display: block; }
        .admin-panel h3 {
            font-family: 'Cinzel', serif;
            color: var(--gold-primary);
            margin-bottom: 12px;
            text-align: center;
            font-size: 1rem;
        }
        .form-group {
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: left;
        }
        .form-group label {
            font-size: 0.85rem;
            color: var(--gold-primary);
            font-weight: 600;
        }
        .form-control {
            background: #08080a;
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 8px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.95rem;
            outline: none;
        }
        .admin-login-box {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .offer-section {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .offer-textarea {
            width: 100%;
            height: 80px;
            background: rgba(12, 11, 16, 0.85);
            border: 1px solid var(--gold-secondary);
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.95rem;
            resize: none;
            outline: none;
        }

        .custom-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 99999;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .custom-modal-box {
            background: rgba(18, 16, 22, 0.98);
            border: 2px solid var(--gold-primary);
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            padding: 24px;
            box-shadow: 0 0 30px var(--gold-glow);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            animation: modalPop 0.3s ease-out;
        }

        @keyframes modalPop {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .custom-modal-title {
            font-family: 'Cinzel', serif;
            color: var(--gold-primary);
            font-size: 1.2rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .custom-modal-msg {
            font-size: 0.95rem;
            color: var(--text-main);
            line-height: 1.5;
        }

        .giveaway-card {
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
            background: rgba(15, 14, 18, 0.98);
            border: 2px solid var(--gold-primary);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9), 0 0 30px rgba(243, 195, 68, 0.25);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            gap: 18px;
            position: relative;
        }

        .close-modal-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--gold-secondary);
            color: var(--gold-primary);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .close-modal-btn:hover {
            background: var(--gold-primary);
            color: #000;
        }

        .giveaway-header {
            text-align: center;
            border-bottom: 1px solid rgba(212, 159, 23, 0.3);
            padding-bottom: 12px;
        }

        .giveaway-header h2 {
            font-family: 'Cinzel', serif;
            color: var(--gold-primary);
            font-size: 1.4rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .giveaway-header p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .giveaway-input-group {
            display: flex;
            gap: 10px;
        }

        .giveaway-input-group input {
            flex-grow: 1;
        }

        .giveaway-options {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            background: rgba(8, 8, 10, 0.6);
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px dashed rgba(212, 159, 23, 0.3);
            align-items: center;
            justify-content: space-between;
        }

        .giveaway-checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--gold-primary);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .giveaway-checkbox-label input {
            width: 18px;
            height: 18px;
            accent-color: var(--gold-primary);
            cursor: pointer;
        }

        .giveaway-numbers {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .giveaway-number-input {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-main);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .giveaway-number-input input {
            width: 60px;
            padding: 4px 8px;
            text-align: center;
        }

        .participants-box {
            max-height: 180px;
            overflow-y: auto;
            background: rgba(8, 8, 10, 0.9);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .participant-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            border-left: 3px solid var(--gold-secondary);
        }

        .participant-item span.comment-text {
            color: var(--text-muted);
            font-size: 0.75rem;
            max-width: 250px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .winner-display-box {
            display: none;
            flex-direction: column;
            gap: 10px;
            background: rgba(212, 159, 23, 0.08);
            border: 2px solid var(--gold-primary);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 0 20px var(--gold-glow);
        }

        .winner-title {
            font-family: 'Cinzel', serif;
            color: var(--gold-primary);
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 1.5px;
        }

        .winner-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }

        .winner-badge {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(90deg, rgba(243, 195, 68, 0.2), rgba(0,0,0,0.4));
            border: 1px solid var(--gold-secondary);
            border-radius: 8px;
            padding: 8px 14px;
            font-weight: 700;
            color: #fff;
        }

        .eliminated-badge {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(90deg, rgba(239, 68, 68, 0.25), rgba(0,0,0,0.5));
            border: 1px solid #ef4444;
            border-radius: 8px;
            padding: 8px 14px;
            font-weight: 700;
            color: #fca5a5;
        }

        .winner-rank {
            background: var(--gold-primary);
            color: #000;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 800;
            font-family: 'Cinzel', serif;
        }

        .eliminated-rank {
            background: #ef4444;
            color: #fff;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 800;
            font-family: 'Cinzel', serif;
        }

        .backup-winner-badge {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed var(--text-muted);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .giveaway-status-msg {
            font-size: 0.85rem;
            color: var(--gold-primary);
            text-align: center;
            font-weight: 600;
            min-height: 20px;
        }

        .tab-toggle-box {
            display: flex;
            gap: 8px;
            margin-bottom: 5px;
        }

        .tab-toggle-btn {
            flex: 1;
            padding: 6px 10px;
            background: rgba(10, 10, 12, 0.8);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 600;
        }

        .tab-toggle-btn.active {
            background: rgba(212, 159, 23, 0.2);
            border-color: var(--gold-primary);
            color: var(--gold-primary);
        }
    </style>
</head>
<body>

    <button onclick="toggleAdminPanel()" class="top-admin-btn">
        <i class="fa-solid fa-lock"></i> Yönetici Girişi
    </button>

    <div class="container">
        <div class="logo-container">
            <img id="mainLogoImg" src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=500&auto=format&fit=crop" alt="MusaRUZGAR Logo" class="custom-logo">
            <div class="brand-domain">MUSA RÜZGAR PAZAR ALANI</div>
        </div>

        <div id="adminPanel" class="admin-panel">
            <div id="loginSection">
                <h3>YÖNETİCİ DOĞRULAMA</h3>
                <div class="admin-login-box">
                    <input type="password" id="adminPassword" class="form-control" placeholder="Admin Şifresi">
                    <button onclick="checkAdminPassword()" class="btn-gold" style="max-width: 100px; padding: 8px;">Giriş</button>
                </div>
            </div>

            <div id="addItemSection" style="display: none;">
                <div class="admin-nav-btns">
                    <button onclick="showAdminTab('tabLogo')" id="btnTabLogo" class="admin-nav-btn active">Logo & Oyun Görselleri</button>
                    <button onclick="showAdminTab('tabStreamer')" id="btnTabStreamer" class="admin-nav-btn">Yayıncı Ekle</button>
                    <button onclick="showAdminTab('tabItem')" id="btnTabItem" class="admin-nav-btn">İlan / Ekipman Ekle</button>
                    <button onclick="showAdminTab('tabApi')" id="btnTabApi" class="admin-nav-btn">Çekiliş API Ayarı</button>
                </div>

                <div id="tabLogo" class="admin-tab-content active">
                    <h3><i class="fa-solid fa-image"></i> PORTAL LOGOSU DEĞİŞTİR</h3>
                    <div class="form-group">
                        <label>Portal Logosu Dosyası (JPG, PNG önerilir)</label>
                        <input type="file" id="newLogoImage" class="form-control" accept="image/*">
                    </div>
                    <button onclick="updateLogo()" id="uploadLogoBtn" class="btn-gold" style="max-width: 100%; margin-top: 5px;">
                        <i class="fa-solid fa-upload"></i> Logoyu Güncelle
                    </button>

                    <hr style="border:0; border-top:1px solid var(--card-border); margin:15px 0;">

                    <h3><i class="fa-solid fa-gamepad"></i> OYUN BUTON GÖRSELLERİ</h3>
                    <div class="form-group">
                        <label>Knight Online Görseli</label>
                        <input type="file" id="knightImgFile" class="form-control" accept="image/*">
                    </div>
                    <div class="form-group">
                        <label>Rise Online Görseli</label>
                        <input type="file" id="riseImgFile" class="form-control" accept="image/*">
                    </div>
                    <button onclick="updateGameTabImages()" id="uploadGameImgsBtn" class="btn-gold" style="max-width: 100%; margin-top: 5px;">
                        <i class="fa-solid fa-upload"></i> Oyun Logolarını Güncelle
                    </button>
                </div>

                <div id="tabStreamer" class="admin-tab-content">
                    <h3><i class="fa-solid fa-video"></i> YAYINCI EKLE (TWITCH / YOUTUBE)</h3>
                    <div class="form-group">
                        <label>Hangi Oyun Sekmesinde Görünsün?</label>
                        <select id="newStreamerGame" class="form-control">
                            <option value="knight">Knight Online</option>
                            <option value="rise">Rise Online</option>
                            <option value="both">İki Tarafa Da Ekle</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Platform</label>
                        <select id="newStreamerPlatform" class="form-control">
                            <option value="twitch">Twitch</option>
                            <option value="youtube">YouTube</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Yayıncı Adı</label>
                        <input type="text" id="newStreamerName" class="
